name: Clippy check

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/clippy.yml'
      - 'userspace/**'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/clippy.yml'
      - 'userspace/**'

env:
  RUSTFLAGS: '-Dwarnings'

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: rustup update stable
      
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: userspace/ksud

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Install Android validation tools
        run: |
          rustup component add rustfmt
          cargo install cargo-ndk --locked

      - name: Check, lint and format Android userspace
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_NDK_PLATFORM: '26'
        run: |
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          source .github/scripts/setup-rust-build.sh x86_64-linux-android 26
          cargo ndk -t arm64-v8a check --workspace
          cargo ndk -t arm64-v8a clippy --workspace
          cargo fmt --all --check
          cargo clippy --target aarch64-linux-android --release
          cargo clippy --target x86_64-linux-android --release
