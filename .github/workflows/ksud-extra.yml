name: Build ksud with cross
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      os:
        required: false
        type: string
        default: ubuntu-latest
      pack_lkm:
        required: false
        type: boolean
        default: false
      pack_ksuinit:
        required: false
        type: boolean
        default: false
      pack_sui:
        required: false
        type: boolean
        default: false
      expected_size:
        required: false
        type: string
        default: ''
      expected_hash:
        required: false
        type: string
        default: ''
jobs:
  build:
    env:
      KSU_EXPECTED_SIZE: ${{ inputs.expected_size }}
      KSU_EXPECTED_HASH: ${{ inputs.expected_hash }}
      KSU_PACKAGE_NAME: ${{ github.event_name == 'pull_request' && 'com.shixiaoshi0417.lunexsu.pr' || 'com.shixiaoshi0417.lunexsu' }}
    runs-on: ${{ inputs.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v8
    
    - name: Prepare LKM files
      if: ${{ inputs.pack_lkm }}
      run: |
        # Public names are LunexSU; the embedded name is a ramdisk/daemon ABI.
        for ko in aarch64-android*-lkm/*_lunexsu.ko; do
          name=$(basename "$ko")
          cp "$ko" "./userspace/ksud/bin/aarch64/${name%_lunexsu.ko}_kernelsu.ko"
        done
        # Public names are LunexSU; the embedded name is a ramdisk/daemon ABI.
        for ko in x86_64-android*-lkm/*_lunexsu.ko; do
          name=$(basename "$ko")
          cp "$ko" "./userspace/ksud/bin/x86_64/${name%_lunexsu.ko}_kernelsu.ko"
        done
    
    - name: Prepare ksuinit
      if: ${{ inputs.pack_ksuinit }}
      run: |
        mv ksuinit-aarch64/ksuinit ./userspace/ksud/bin/aarch64/
        mv ksuinit-x86_64/ksuinit ./userspace/ksud/bin/x86_64/
        mv ksuinit-riscv64/ksuinit ./userspace/ksud/bin/riscv64/
        
    - name: Prepare managed Sui assets
      if: ${{ inputs.pack_sui }}
      run: |
        package=com.shixiaoshi0417.lunexsu
        if [ '${{ github.event_name }}' = pull_request ]; then package="$package.pr"; fi
        python3 scripts/stage_sui_payload.py --artifact sui-payload --source userspace/sui --assets userspace/ksud/bin \
          --manager-package "$package" --manager-size "$KSU_EXPECTED_SIZE" --manager-hash "$KSU_EXPECTED_HASH"

    - name: Setup rustup
      run: |
        rustup update stable
        if [[ ${{ inputs.target }} == *"-apple-darwin" ]]; then
          rustup target add ${{ inputs.target }}
        fi
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: userspace/ksud
        cache-targets: false
        cache-bin: false

    - name: Install cross
      run: |
        RUSTFLAGS="" cargo install cross --git https://github.com/cross-rs/cross --rev 66845c1

    - name: Assemble LKM bootstrap
      run: |
        clang --target=aarch64-linux-gnu -c -nostdlib \
          -o userspace/ksud/.lkm_image_bootstrap.o \
          userspace/ksud/src/lkm_image_bootstrap.S

    - name: Build ksud
      run: CROSS_NO_WARNINGS=0 cross build --target ${{ inputs.target }} --release --manifest-path ./userspace/ksud/Cargo.toml

    - name: Upload ksud artifact
      uses: actions/upload-artifact@v7
      with:
        name: ksud-${{ inputs.target }}
        path: target/${{ inputs.target }}/release/ksud*
