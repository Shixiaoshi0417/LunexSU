name: Build Manager

on:
  push:
    branches: [ "main", "dev", "ci" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ddk-lkm.yml'
      - '.github/workflows/ksud.yml'
      - '.github/workflows/ksud-extra.yml'
      - '.github/workflows/ksuinit.yml'
      - '.github/workflows/sui.yml'
      - 'scripts/prepare_sui_artifact.py'
      - 'scripts/stage_sui_payload.py'
      - 'scripts/sui_source_inputs.py'
      - 'scripts/sui_manager_binding.py'
      - '.github/scripts/setup-rust-build.sh'
      - '.github/scripts/check-bundled-assets.py'
      - '.github/scripts/check-pr-unsigned-apk.py'
      - '.github/scripts/check-lkm-version.sh'
      - 'tests/build_version/**'
      - '.github/riscv64-cargo.toml'
      - 'repack_apk.py'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ddk-lkm.yml'
      - '.github/workflows/ksud.yml'
      - '.github/workflows/ksud-extra.yml'
      - '.github/workflows/ksuinit.yml'
      - '.github/workflows/sui.yml'
      - 'scripts/prepare_sui_artifact.py'
      - 'scripts/stage_sui_payload.py'
      - 'scripts/sui_source_inputs.py'
      - 'scripts/sui_manager_binding.py'
      - '.github/scripts/setup-rust-build.sh'
      - '.github/scripts/check-bundled-assets.py'
      - '.github/scripts/check-pr-unsigned-apk.py'
      - '.github/scripts/check-lkm-version.sh'
      - 'tests/build_version/**'
      - '.github/riscv64-cargo.toml'
      - 'repack_apk.py'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_call:
  workflow_dispatch:
    inputs:
      no_root_demo:
        description: 'Build the independent No Root UI demo (simulated operations only)'
        type: boolean
        required: false
        default: false

jobs:
  build-no-root-demo:
    if: github.event_name == 'workflow_dispatch' && inputs.no_root_demo == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Create isolated demo signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/demo.jks" -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=LunexSU No Root Demo" -storetype JKS
      - name: Build and test the demo without native root payloads
        working-directory: manager
        run: |
          ./gradlew clean assembleRelease testDebugUnitTest assembleDebugAndroidTest \
            -PNO_ROOT_DEMO=true -PNO_ROOT_DEMO_KEYSTORE="$RUNNER_TEMP/demo.jks"
      - name: Verify demo APK isolation
        run: python3 scripts/verify_no_root_demo_apk.py manager/app/build/outputs/apk/release
      - uses: actions/upload-artifact@v7
        with:
          name: manager-no-root-demo
          path: manager/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  generate-key:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.no_root_demo == true) }}
    runs-on: ubuntu-latest
    outputs:
      expected_size: ${{ steps.extract.outputs.expected_size || steps.extract_prod.outputs.expected_size }}
      expected_hash: ${{ steps.extract.outputs.expected_hash || steps.extract_prod.outputs.expected_hash }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Disable installable PR signing identities
        if: github.event_name == 'pull_request'
        id: extract
        run: |
          # A one-byte certificate cannot be a valid DER signing certificate.
          # PR Core artifacts are compilation fixtures, never installable pairs.
          # Only public, non-secret constants cross jobs. No PR private key exists.
          echo "expected_size=0x0001" >> "$GITHUB_OUTPUT"
          printf 'expected_hash=%064d\n' 0 >> "$GITHUB_OUTPUT"
          echo '::notice::PR artifacts are compile-only. Use a reviewed branch workflow_dispatch for installable test packages.'

      - name: Extract production certificate hash and size
        if: github.event_name != 'pull_request'
        id: extract_prod
        env:
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          PROD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Bind Core to the same certificate used by Repack and resign.
          # Missing credentials must fail rather than use the upstream signer.
          test -n "$PROD_KEYSTORE"
          test -n "$PROD_KEYSTORE_PASSWORD"
          test -n "$PROD_KEY_ALIAS"
          printf '%s' "$PROD_KEYSTORE" | base64 -d > production-key.jks
          keytool -exportcert \
            -alias "$PROD_KEY_ALIAS" \
            -keystore production-key.jks \
            -storepass "$PROD_KEYSTORE_PASSWORD" \
            -file production-cert.der
          SIZE_DEC=$(stat -c%s production-cert.der)
          # Core's apk_sign.c reads at most 1024 certificate bytes; a larger
          # certificate builds fine but can never be recognized as the manager.
          if [ "$SIZE_DEC" -gt 1024 ]; then
            echo "::error::Release certificate is $SIZE_DEC bytes; Core accepts at most 1024 (use RSA 2048 or EC)"
            exit 1
          fi
          SIZE_HEX=$(printf '0x%04x' "$SIZE_DEC")
          HASH=$(sha256sum production-cert.der | awk '{print $1}')
          # Kbuild defaults serve setup.sh and manual Core builds without CI overrides.
          DEFAULT_SIZE=$(sed -n 's/^KSU_EXPECTED_SIZE ?= //p' kernel/Kbuild)
          DEFAULT_HASH=$(sed -n 's/^KSU_EXPECTED_HASH ?= //p' kernel/Kbuild)
          if [ "$DEFAULT_SIZE" != "$SIZE_HEX" ] || [ "$DEFAULT_HASH" != "$HASH" ]; then
            echo "::error::kernel/Kbuild defaults ($DEFAULT_SIZE $DEFAULT_HASH) do not match the release certificate ($SIZE_HEX $HASH)"
            exit 1
          fi
          echo "expected_size=$SIZE_HEX" >> "$GITHUB_OUTPUT"
          echo "expected_hash=$HASH" >> "$GITHUB_OUTPUT"

  build-lkm:
    needs: generate-key
    uses: ./.github/workflows/build-lkm.yml
    with:
      expected_size: ${{ needs.generate-key.outputs.expected_size || '' }}
      expected_hash: ${{ needs.generate-key.outputs.expected_hash || '' }}
    secrets: inherit

  build-ksuinit:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.no_root_demo == true) }}
    uses: ./.github/workflows/ksuinit.yml

  build-sui:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.no_root_demo == true) }}
    needs: generate-key
    uses: ./.github/workflows/sui.yml
    with:
      expected_size: ${{ needs.generate-key.outputs.expected_size }}
      expected_hash: ${{ needs.generate-key.outputs.expected_hash }}

  build-ksud:
    needs: [generate-key, build-lkm, build-ksuinit, build-sui]
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
          - target: x86_64-linux-android
          - target: riscv64-linux-android
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      pack_lkm: true
      pack_ksuinit: true
      pack_sui: true
      expected_size: ${{ needs.generate-key.outputs.expected_size }}
      expected_hash: ${{ needs.generate-key.outputs.expected_hash }}
  
  build-ksud-extra:
    needs: [generate-key, build-lkm, build-ksuinit, build-sui]
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-gnu # windows pc
            os: ubuntu-latest
          - target: x86_64-apple-darwin # Intel mac
            os: macos-latest
          - target: aarch64-apple-darwin # M chip mac
            os: macos-latest
          - target: aarch64-unknown-linux-musl # arm64 Linux
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl # x86 Linux
            os: ubuntu-latest
    uses: ./.github/workflows/ksud-extra.yml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}
      pack_lkm: true
      pack_ksuinit: true
      pack_sui: true
      expected_size: ${{ needs.generate-key.outputs.expected_size }}
      expected_hash: ${{ needs.generate-key.outputs.expected_hash }}

  build-manager:
    needs: [generate-key, build-ksud]
    if: always() && needs.generate-key.result == 'success' && needs.build-ksud.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write key
        if: github.event_name != 'pull_request'
        env:
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          PROD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PROD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$PROD_KEYSTORE"
          test -n "$PROD_KEYSTORE_PASSWORD"
          test -n "$PROD_KEY_ALIAS"
          test -n "$PROD_KEY_PASSWORD"
          {
            printf 'KEYSTORE_PASSWORD=%s\n' "$PROD_KEYSTORE_PASSWORD"
            printf 'KEY_ALIAS=%s\n' "$PROD_KEY_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$PROD_KEY_PASSWORD"
            printf 'KEYSTORE_FILE=key.jks\n'
          } >> gradle.properties
          printf '%s' "$PROD_KEYSTORE" | base64 -d > key.jks

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download matching Android daemons before Gradle
        uses: actions/download-artifact@v8
        with:
          pattern: ksud-*-linux-android
          path: artifacts/android-daemons

      - name: Stage matching daemon libraries
        run: |
          for pair in arm64-v8a:aarch64-linux-android x86_64:x86_64-linux-android riscv64:riscv64-linux-android; do
            ABI=${pair%%:*}
            TARGET=${pair#*:}
            DAEMON="$GITHUB_WORKSPACE/artifacts/android-daemons/ksud-$TARGET/ksud"
            test -f "$DAEMON"
            mkdir -p "app/src/main/jniLibs/$ABI"
            cp "$DAEMON" "app/src/main/jniLibs/$ABI/libksud.so"
          done

      - name: Build with Gradle
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew clean assembleRelease :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin -PIS_PR_BUILD=true
          else
            ./gradlew clean assembleRelease :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin
          fi

      - name: Verify unsigned PR artifact
        if: github.event_name == 'pull_request'
        run: python3 ../.github/scripts/check-pr-unsigned-apk.py app/build/outputs/apk/release

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name == 'pull_request' && 'manager-pr-compile-only' || 'manager-gradle' }}
          path: manager/app/build/outputs/apk/release/*.apk

      - name: Upload mappings
        uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: "mappings"
          path: "manager/app/build/outputs/mapping/release/"

  repack-manager:
    needs: [build-manager, build-ksud, generate-key]
    if: always() && github.event_name != 'pull_request' && needs.build-manager.result == 'success' && needs.build-ksud.result == 'success' && needs.generate-key.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup need_upload
        id: need_upload
        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            echo "UPLOAD=true" >> $GITHUB_OUTPUT
          else
            echo "UPLOAD=false" >> $GITHUB_OUTPUT
          fi

      - name: Download gradle manager artifact
        uses: actions/download-artifact@v8
        with:
          name: manager-gradle
          path: artifacts/manager-gradle

      - name: Download arm64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-aarch64-linux-android

      - name: Download x86_64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-x86_64-linux-android
          path: artifacts/ksud-x86_64-linux-android

      - name: Download RISC-V ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-riscv64-linux-android
          path: artifacts/ksud-riscv64-linux-android

      - name: Place manager apk and ksud artifacts
        run: |
          mkdir -p manager/app/build/outputs/apk/release
          APK=$(find artifacts/manager-gradle -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp -f "$APK" manager/app/build/outputs/apk/release/

          mkdir -p target/aarch64-linux-android/release
          mkdir -p target/x86_64-linux-android/release
          mkdir -p target/riscv64-linux-android/release
          ARM64_KSUD=$(find artifacts/ksud-aarch64-linux-android -type f -name ksud | head -n 1)
          X86_64_KSUD=$(find artifacts/ksud-x86_64-linux-android -type f -name ksud | head -n 1)
          RISCV64_KSUD=$(find artifacts/ksud-riscv64-linux-android -type f -name ksud | head -n 1)
          test -n "$ARM64_KSUD"
          test -n "$X86_64_KSUD"
          test -n "$RISCV64_KSUD"
          cp -f "$ARM64_KSUD" target/aarch64-linux-android/release/ksud
          cp -f "$X86_64_KSUD" target/x86_64-linux-android/release/ksud
          cp -f "$RISCV64_KSUD" target/riscv64-linux-android/release/ksud

      - name: Prepare signing inputs
        env:
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PROD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$PROD_KEYSTORE"
          test -n "$PROD_KEY_ALIAS"
          test -n "$PROD_KEYSTORE_PASSWORD"
          test -n "$PROD_KEY_PASSWORD"
          printf '%s' "$PROD_KEYSTORE" | base64 -d > key.jks
          echo "SIGN_KEYSTORE_FILE=key.jks" >> "$GITHUB_ENV"
          echo "SIGN_KEY_ALIAS=$PROD_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGN_KEYSTORE_PASSWORD=$PROD_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGN_KEY_PASSWORD=$PROD_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Repack and resign
        run: |
          python3 repack_apk.py repack \
            -b release \
            -t release \
            -a arm64-v8a \
            -a x86_64 \
            -a riscv64 \
            -K "$SIGN_KEYSTORE_FILE" \
            -A "$SIGN_KEY_ALIAS" \
            -P "$SIGN_KEYSTORE_PASSWORD" \
            -S "$SIGN_KEY_PASSWORD" \
            --require-kmi arm64-v8a:android12-5.10 \
            --require-kmi x86_64:android12-5.10 \
            --strip

      - name: Verify APK signature matches Core
        env:
          EXPECTED_CERT_HASH: ${{ needs.generate-key.outputs.expected_hash }}
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:?}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -n "$EXPECTED_CERT_HASH"
          for APK in dist/*.apk; do
            SIGNATURE_INFO=$("$APKSIGNER" verify --print-certs "$APK")
            # SDK 37 uses scheme labels (e.g. V3.0 Signer) instead of Signer #1.
            # Require every reported signing certificate to match Core.
            ACTUAL_HASH=$(printf '%s\n' "$SIGNATURE_INFO" | awk '/ certificate SHA-256 digest:/ { print $NF }' | sort -u)
            test "$ACTUAL_HASH" = "$EXPECTED_CERT_HASH"
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: manager
          path: dist/*.apk

      - name: Upload to telegram
        if: github.event_name != 'pull_request' && steps.need_upload.outputs.UPLOAD == 'true'
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MESSAGE_THREAD_ID: ${{ secrets.MESSAGE_THREAD_ID }}
          GITHUB_EVENT: ${{ toJson(github.event) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Manager
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            export VERSION=$(git rev-list --count HEAD)
            APK=$(find ./dist -name "*.apk")
            pip3 install telethon
            python3 $GITHUB_WORKSPACE/scripts/ksubot.py $APK
          fi
