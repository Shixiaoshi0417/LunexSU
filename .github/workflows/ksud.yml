name: Build ksud
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      pack_lkm:
        required: false
        type: boolean
        default: false
      pack_ksuinit:
        required: false
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v8
    
    - name: Prepare LKM files
      if: ${{ inputs.pack_lkm }}
      run: |
        # Public names are LunexSU; the embedded name is a ramdisk/daemon ABI.
        for ko in aarch64-android*-lkm/*_lunexsu.ko; do
          name=$(basename "$ko")
          cp "$ko" "./userspace/ksud/bin/aarch64/${name%_lunexsu.ko}_kernelsu.ko"
        done
        # Public names are LunexSU; the embedded name is a ramdisk/daemon ABI.
        for ko in x86_64-android*-lkm/*_lunexsu.ko; do
          name=$(basename "$ko")
          cp "$ko" "./userspace/ksud/bin/x86_64/${name%_lunexsu.ko}_kernelsu.ko"
        done
    
    - name: Prepare ksuinit
      if: ${{ inputs.pack_ksuinit }}
      run: |
        mv ksuinit-aarch64/ksuinit ./userspace/ksud/bin/aarch64/
        mv ksuinit-x86_64/ksuinit ./userspace/ksud/bin/x86_64/
        mv ksuinit-riscv64/ksuinit ./userspace/ksud/bin/riscv64/
        
    - name: Verify bundled boot assets
      if: ${{ inputs.pack_lkm && inputs.pack_ksuinit }}
      run: |
        python3 .github/scripts/check-bundled-assets.py --arch aarch64 --arch x86_64 --kmi android12-5.10

    - name: Setup rustup
      run: |
        if [ "${{ inputs.target }}" = riscv64-linux-android ]; then
          rustup toolchain install nightly-2026-09-23 --profile minimal --component rust-src
        else
          rustup update stable
          rustup target add ${{ inputs.target }}
        fi

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: userspace/ksud
        cache-targets: false

    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r29

    - name: Build ksud
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          export KSU_PACKAGE_NAME="com.shixiaoshi0417.lunexsu.pr"
        fi
        if [ "${{ inputs.target }}" = riscv64-linux-android ]; then
          source .github/scripts/setup-rust-build.sh riscv64-linux-android 35
          cargo +nightly-2026-09-23 build --config .github/riscv64-cargo.toml -Z build-std=std,panic_abort --target "$TRIPLE" --release --manifest-path ./userspace/ksud/Cargo.toml
        else
          source .github/scripts/setup-rust-build.sh ${{ inputs.target }} 26
          cargo build --target "$TRIPLE" --release --manifest-path ./userspace/ksud/Cargo.toml
        fi

    - name: Upload ksud artifact
      uses: actions/upload-artifact@v7
      with:
        name: ksud-${{ inputs.target }}
        path: target/${{ inputs.target }}/release/ksud
