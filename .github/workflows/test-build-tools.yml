name: Build tool regression tests

on:
  push:
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/test-build-tools.yml'
      - '.github/scripts/**'
      - 'scripts/**'
      - 'kernel/build-all.sh'
      - 'uapi/app_profile.h'
      - 'userspace/ksud/build.rs'
      - 'userspace/sui/build.gradle.kts'
      - 'tests/build_tools/**'
  pull_request:
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/test-build-tools.yml'
      - '.github/scripts/**'
      - 'scripts/**'
      - 'kernel/build-all.sh'
      - 'uapi/app_profile.h'
      - 'userspace/ksud/build.rs'
      - 'userspace/sui/build.gradle.kts'
      - 'tests/build_tools/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.1'
      - name: Test build state, public provenance and literal credential transport
        run: python3 -B -m unittest discover -s tests/build_tools -v
